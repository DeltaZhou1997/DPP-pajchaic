<!DOCTYPE html>
<html lang="EN">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>responsive</title>
        
        <style>
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            table {
                width: 100%;
                height: 100%;
                border: 1px solid rgb(71, 42, 42);
                border-collapse: collapse;
            }
            
            td {
                height: 200px;
                font-family: monospace;
                justify-content: center;
                text-align: center;
                font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td style="background: rgb(139, 162, 69)">Coffee</td>
                <td style="background: pink">Lover</td>
            </tr>
        </table>
    </body>
</html>
